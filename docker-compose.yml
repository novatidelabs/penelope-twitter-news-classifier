version: '3.8'

services:
  twitter-classifier:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: twitter-news-classifier
    env_file: 
      - .env
    volumes:
      - ./results:/app/results
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; print('Health check passed'); sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    networks:
      - twitter-classifier-network

networks:
  twitter-classifier-network:
    driver: bridge
